<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Розширення фінансового масштабу</title>
<meta name="description" content="Групова програма для підприємців, керівників і експертів про те, як страхи, звичні реакції та ставлення до власної цінності впливають на рішення про гроші. Ведуча — Яна Лінкова.">
<meta name="theme-color" content="#8b6a33">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Tenor+Sans&display=swap">
<style>
/* Layout: теплий «папір» + бронза з макета Canva; наскрізний мотив — лінія доходу під пунктирною «стелею» */
:root {
  --bg: #ece4d8;
  --surface: #f8f3eb;
  --ink: #1c1b1f;
  --muted: #5f574b;
  --line: #d6c9b5;
  --bronze: #8b6a33;
  --bronze-ink: #6e5224;
  --bronze-soft: #e2d4bc;
  --plum: #5e1846;
  --on-dark: #f8f3eb;
  --on-bronze: #ffffff;
  --ok: #2f7a4a;
  --err: #b3362b;
  --tg: #229ed9;

  --f-display: "Tenor Sans", "Golos Text", Georgia, serif;
  --f-body: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

  --r: 4px;
  --gutter: clamp(16px, 4vw, 40px);
  --maxw: 1160px;
  --header-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16130f; --surface: #201b15; --ink: #efe7da; --muted: #b3a795; --line: #3a3126;
    --bronze: #c9a064; --bronze-ink: #e0bf8a; --bronze-soft: #33291c; --plum: #d58ab8;
    --on-dark: #16130f; --on-bronze: #16130f; --ok: #6fcf94; --err: #ff8a7d; --tg: #3fb2e6; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #16130f; --surface: #201b15; --ink: #efe7da; --muted: #b3a795; --line: #3a3126;
  --bronze: #c9a064; --bronze-ink: #e0bf8a; --bronze-soft: #33291c; --plum: #d58ab8;
  --on-dark: #16130f; --on-bronze: #16130f; --ok: #6fcf94; --err: #ff8a7d; --tg: #3fb2e6; color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: calc(var(--header-h) + 16px); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 1rem/1.6 var(--f-body); -webkit-font-smoothing: antialiased; }
img, svg { max-width: 100%; }
a { color: var(--bronze-ink); }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; line-height: 1.15; margin: 0; text-wrap: balance; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
:focus-visible { outline: 3px solid var(--bronze); outline-offset: 3px; }

.wrap { width: 100%; max-width: var(--maxw); margin-inline: auto; padding-inline: var(--gutter); }
[data-i18n-root] { transition: opacity .25s ease; }
.is-switching [data-i18n-root] { opacity: .15; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .6em;
  min-height: 50px; padding: .8em 1.6em; border-radius: var(--r); border: 1.5px solid transparent;
  font: 600 .95rem/1.2 var(--f-body); text-decoration: none; cursor: pointer; text-align: center;
  transition: transform .15s ease, background-color .2s ease, border-color .2s ease, color .2s ease;
}
.btn:active { transform: translateY(1px); }
.btn--primary { background: var(--ink); color: var(--bg); }
.btn--primary:hover { background: var(--bronze-ink); color: var(--on-dark); }
.btn--ghost { border-color: var(--ink); color: var(--ink); background: transparent; }
.btn--ghost:hover { background: var(--ink); color: var(--bg); }
.btn--tg { background: var(--tg); color: #fff; }
.btn--tg:hover { filter: brightness(1.08); }
.btn svg { width: 1.15em; height: 1.15em; flex: none; }

/* ---------- Header ---------- */
.header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(1.3) blur(12px); -webkit-backdrop-filter: saturate(1.3) blur(12px);
  border-bottom: 1px solid var(--line);
}
.header__row { display: flex; align-items: center; gap: 16px; min-height: var(--header-h); }
.logo { display: grid; text-decoration: none; color: var(--ink); line-height: 1.15; min-width: 0; }
.logo b { font: 400 1.05rem var(--f-display); letter-spacing: .08em; text-transform: uppercase; }
.logo span { font-size: .72rem; color: var(--muted); letter-spacing: .04em; }
.nav { display: none; margin-left: auto; gap: 2px; }
.nav a { color: var(--muted); text-decoration: none; font-weight: 500; font-size: .92rem; padding: .5em .75em; }
.nav a:hover { color: var(--ink); }
.header__tools { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.lang { display: inline-flex; padding: 3px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.lang button { border: 0; background: transparent; color: var(--muted); cursor: pointer; font: 600 .78rem/1 var(--f-body); letter-spacing: .06em; padding: .6em .8em; border-radius: 999px; min-height: 34px; }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.header .btn--tg { display: none; min-height: 40px; padding: .55em 1.1em; border-radius: 999px; }
.burger { width: 44px; height: 44px; border: 1px solid var(--line); border-radius: 50%; background: var(--surface); color: var(--ink); cursor: pointer; display: grid; place-items: center; }
.burger svg { width: 20px; height: 20px; }
.mnav { border-top: 1px solid var(--line); padding-block: 12px 20px; }
.mnav a { display: block; padding: .8em 0; color: var(--ink); text-decoration: none; font-weight: 500; border-bottom: 1px solid var(--line); }
.mnav .btn { margin-top: 16px; width: 100%; }
@media (min-width: 1000px) {
  .nav { display: flex; }
  .header__tools { margin-left: 8px; }
  .header .btn--tg { display: inline-flex; }
  .burger, .mnav { display: none !important; }
}

/* ---------- Sections ---------- */
.section { padding-block: clamp(56px, 9vw, 104px); }
.section--alt { background: var(--surface); border-block: 1px solid var(--line); }
.section--dark { background: var(--ink); color: var(--bg); }
.eyebrow { font: 600 .74rem/1.3 var(--f-body); letter-spacing: .16em; text-transform: uppercase; color: var(--bronze); }
.s-head { display: grid; gap: 14px; max-width: 48rem; margin-bottom: clamp(28px, 5vw, 48px); }
.s-head h2 { font-size: clamp(1.6rem, 4vw, 2.6rem); }
.s-head p { color: var(--muted); font-size: 1.05rem; max-width: 62ch; }

/* ---------- Hero ---------- */
.hero { padding-block: clamp(32px, 6vw, 72px) clamp(48px, 8vw, 96px); }
.hero__grid { display: grid; gap: 40px; align-items: center; }
.hero__text { display: grid; gap: 22px; min-width: 0; }
.tag { width: fit-content; padding: .5em 1em; background: var(--bronze); color: var(--on-bronze); font-weight: 600; font-size: .86rem; line-height: 1.35; }
.hero h1 { font-size: clamp(2.3rem, 8vw, 4.6rem); line-height: 1.02; letter-spacing: -0.01em; }
.hero__q { font: 600 clamp(1.1rem, 2.4vw, 1.3rem)/1.35 var(--f-body); }
.hero__sub { display: grid; gap: 10px; color: var(--muted); font-size: 1.04rem; max-width: 56ch; }
.meta { display: flex; flex-wrap: wrap; gap: 8px 18px; padding-block: 16px; border-block: 1px solid var(--line); font-weight: 600; font-variant-numeric: tabular-nums; }
.meta span { display: inline-flex; align-items: center; gap: 8px; }
.meta span + span::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--bronze); margin-right: 10px; }
.hero__cta { display: flex; flex-wrap: wrap; gap: 12px; }
.hero__photo { position: relative; max-width: 440px; width: 100%; margin-inline: auto; }
.hero__photo img { display: block; width: 100%; aspect-ratio: 460 / 561; object-fit: cover; border: 10px solid var(--surface); box-shadow: 0 30px 60px -30px rgba(40, 28, 10, .45); }
.hero__badge { position: absolute; left: -12px; bottom: 24px; max-width: 80%; padding: 14px 18px; background: var(--ink); color: var(--bg); display: grid; gap: 2px; }
.hero__badge b { font: 400 1.05rem var(--f-display); letter-spacing: .04em; }
.hero__badge span { font-size: .8rem; opacity: .8; }
@media (min-width: 900px) { .hero__grid { grid-template-columns: 1.25fr .75fr; gap: 64px; } .hero__badge { left: -28px; } }

/* ---------- Pain points ---------- */
.banner { padding: 18px 22px; background: var(--bronze); color: var(--on-bronze); font: 400 clamp(1.15rem, 2.8vw, 1.6rem)/1.3 var(--f-display); text-wrap: balance; margin-bottom: 36px; }
.pains-grid { display: grid; gap: 36px; }
.ceiling { background: var(--surface); border: 1px solid var(--line); padding: 20px 20px 12px; }
.ceiling svg { display: block; width: 100%; height: auto; }
.ceiling .axis { stroke: var(--line); stroke-width: 1; }
.ceiling .lim { stroke: var(--bronze); stroke-width: 2; stroke-dasharray: 6 6; }
.ceiling .inc { fill: none; stroke: var(--ink); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.ceiling .new { fill: none; stroke: var(--plum); stroke-width: 2.5; stroke-dasharray: 5 6; stroke-linecap: round; }
.ceiling text { font: 500 12px var(--f-body); fill: var(--muted); }
.ceiling text.lim-l { fill: var(--bronze); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
.ceiling text.new-l { fill: var(--plum); font-weight: 600; }
.ceiling figcaption { font-size: .82rem; color: var(--muted); padding-top: 8px; }
.pains { display: grid; gap: 0; border-top: 1px solid var(--line); }
.pains li { display: grid; gap: 6px; padding: 20px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.pains h3 { font-size: 1.2rem; }
.pains p { color: var(--muted); }
.closing { margin-top: 36px; display: grid; gap: 20px; justify-items: start; }
.closing p { font: 400 clamp(1.2rem, 2.8vw, 1.6rem)/1.35 var(--f-display); max-width: 40ch; }
@media (min-width: 760px) { .pains { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 40px; border-top: 0; } .pains li:nth-child(-n+2) { border-top: 1px solid var(--line); } }
@media (min-width: 1000px) { .pains-grid { grid-template-columns: .8fr 1.2fr; gap: 56px; align-items: start; } .ceiling { position: sticky; top: calc(var(--header-h) + 24px); } }

/* ---------- Self-test ---------- */
.test { display: grid; gap: 10px; }
.check { display: grid; grid-template-columns: 28px minmax(0,1fr); gap: 14px; align-items: start; padding: 16px 18px; background: var(--surface); border: 1px solid var(--line); cursor: pointer; transition: border-color .2s, background-color .2s; }
.check:hover { border-color: var(--bronze); }
.check input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.check__box { width: 26px; height: 26px; border: 1.5px solid var(--ink); display: grid; place-items: center; background: var(--bg); transition: background-color .2s; }
.check__box svg { width: 16px; height: 16px; opacity: 0; color: var(--bg); transition: opacity .15s; }
.check input:checked ~ .check__box { background: var(--ink); }
.check input:checked ~ .check__box svg { opacity: 1; }
.check input:focus-visible ~ .check__box { outline: 3px solid var(--bronze); outline-offset: 2px; }
.check:has(input:checked) { border-color: var(--ink); }
.test__foot { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: center; justify-content: space-between; }
.test__note { color: var(--muted); font-size: .95rem; max-width: 56ch; }
.test__count { font-weight: 600; font-variant-numeric: tabular-nums; }
@media (min-width: 860px) { .test { grid-template-columns: repeat(2, minmax(0,1fr)); } }

/* ---------- Logic ---------- */
.chain { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font: 400 clamp(1.15rem, 3vw, 1.7rem) var(--f-display); margin-bottom: clamp(28px, 5vw, 44px); }
.chain span.arr { color: var(--bronze); }
.steps { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); }
.step { display: grid; gap: 10px; padding: 26px; background: var(--bg); min-width: 0; align-content: start; }
.step__n { font: 400 2.2rem/1 var(--f-display); color: var(--bronze); font-variant-numeric: tabular-nums; }
.step h3 { font: 600 1.05rem/1.35 var(--f-body); }
.step p { color: var(--muted); }
.logic__note { margin-top: 24px; padding-left: 18px; border-left: 3px solid var(--bronze); font-weight: 500; max-width: 60ch; }
@media (min-width: 760px) { .steps { grid-template-columns: repeat(2, minmax(0,1fr)); } }
@media (min-width: 1100px) { .steps { grid-template-columns: repeat(4, minmax(0,1fr)); } }

/* ---------- Program ---------- */
.modules { display: grid; gap: 12px; }
.mod { border: 1px solid var(--line); background: var(--bg); }
.mod summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 16px 20px; align-items: center; padding: 20px; }
.mod summary::-webkit-details-marker { display: none; }
.mod__n { font: 400 2rem/1 var(--f-display); color: var(--bronze); font-variant-numeric: tabular-nums; }
.mod__kicker { display: block; font: 600 .74rem/1.3 var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.mod__title { font: 400 clamp(1.05rem, 2.4vw, 1.3rem)/1.3 var(--f-display); }
.mod__plus { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--ink); display: grid; place-items: center; transition: transform .25s ease, background-color .2s; }
.mod[open] .mod__plus { transform: rotate(45deg); background: var(--ink); color: var(--bg); }
.mod__body { padding: 0 20px 24px; display: grid; gap: 20px; }
.mod__desc { display: grid; gap: 12px; min-width: 0; }
.mod__desc p { color: var(--muted); }
.mod__res { padding: 14px 16px; background: var(--bronze-soft); color: var(--ink); font-weight: 500; }
.mod__res b { display: block; font-size: .74rem; letter-spacing: .12em; text-transform: uppercase; color: var(--bronze-ink); margin-bottom: 4px; }
.mod__list h4 { margin: 0 0 10px; font: 600 .78rem var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--bronze-ink); }
.mod__list ul { display: grid; gap: 8px; }
.mod__list li { display: grid; grid-template-columns: 18px minmax(0,1fr); gap: 8px; }
.mod__list li::before { content: "—"; color: var(--bronze); }
@media (min-width: 860px) {
  .mod summary { padding: 24px 28px; }
  .mod__body { grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 32px; padding: 0 28px 28px 92px; }
}

/* ---------- Outcomes ---------- */
.outcomes { display: grid; gap: 14px; }
.out { display: grid; gap: 8px; padding: 24px; background: var(--surface); border: 1px solid var(--line); min-width: 0; align-content: start; }
.out h3 { font-size: 1.15rem; }
.out p { color: var(--muted); }
.out--wide { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.out--wide p { color: var(--bg); opacity: .78; }
@media (min-width: 760px) { .outcomes { grid-template-columns: repeat(2, minmax(0,1fr)); } .out--wide { grid-column: 1 / -1; } }
@media (min-width: 1100px) { .outcomes { grid-template-columns: repeat(3, minmax(0,1fr)); } .out--wide { grid-column: span 3; } }

/* ---------- Host ---------- */
.host { display: grid; gap: 32px; align-items: start; }
.host__photo img { display: block; width: 100%; max-width: 420px; aspect-ratio: 460 / 561; object-fit: cover; }
.host__text { display: grid; gap: 20px; min-width: 0; }
.host__name { font-size: clamp(1.8rem, 4.4vw, 2.8rem); text-transform: uppercase; letter-spacing: .04em; }
.host__role { color: var(--muted); letter-spacing: .08em; text-transform: uppercase; font-size: .86rem; }
.host__rule { width: 120px; height: 2px; background: var(--plum); }
.motto { padding: 20px 22px; background: var(--surface); border: 1px solid var(--line); display: grid; gap: 8px; }
.motto b { font-size: 1.08rem; }
.motto span { color: var(--muted); }
.bio { display: grid; gap: 12px; }
.bio li { display: grid; grid-template-columns: 16px minmax(0,1fr); gap: 10px; }
.bio li::before { content: ""; width: 6px; height: 6px; margin-top: .65em; border-radius: 50%; background: var(--ink); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; padding-top: 8px; }
.stat { display: grid; gap: 8px; align-content: start; }
.stat b { font: 400 clamp(1.8rem, 5vw, 2.6rem)/1 var(--f-display); color: var(--plum); font-variant-numeric: tabular-nums; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.stat span { font-size: .84rem; color: var(--muted); line-height: 1.35; }
@media (min-width: 900px) { .host { grid-template-columns: 420px minmax(0,1fr); gap: 64px; } }

/* ---------- Packages ---------- */
.packages { margin-top: clamp(40px, 7vw, 72px); display: grid; gap: 20px; }
.pk-list { display: grid; gap: 12px; }
.pk { display: grid; gap: 14px; align-content: start; padding: 24px; background: var(--surface); border: 1px solid var(--line); min-width: 0; }
.pk--mid { border: 1.5px solid var(--ink); }
.pk h3 { font-size: 1.3rem; }
.pk dl { margin: 0; display: grid; gap: 8px; }
.pk dl div { display: flex; justify-content: space-between; gap: 12px; padding-bottom: 8px; border-bottom: 1px dashed var(--line); font-size: .93rem; }
.pk dt { color: var(--muted); }
.pk dd { margin: 0; font-weight: 600; text-align: right; }
.pk dd.tbd { font-weight: 500; color: var(--muted); font-style: italic; }
.pk .btn { width: 100%; }
@media (min-width: 860px) { .pk-list { grid-template-columns: repeat(3, minmax(0,1fr)); } }

/* ---------- FAQ ---------- */
.faq { display: grid; gap: 10px; max-width: 820px; }
.faq details { border-bottom: 1px solid var(--line); }
.faq summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; gap: 16px; align-items: center; padding: 20px 0; font: 400 clamp(1.05rem, 2.4vw, 1.25rem)/1.35 var(--f-display); }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: "+"; font: 400 1.6rem/1 var(--f-body); color: var(--bronze); transition: transform .2s; }
.faq details[open] summary::after { transform: rotate(45deg); }
.faq p { padding-bottom: 22px; color: var(--muted); max-width: 65ch; }

/* ---------- Not for ---------- */
.notfor { display: grid; gap: 1px; background: color-mix(in srgb, var(--bg) 20%, transparent); }
.nf { display: grid; grid-template-columns: 36px minmax(0,1fr); gap: 16px; padding: 22px 0; border-bottom: 1px solid color-mix(in srgb, var(--bg) 22%, transparent); }
.nf__x { width: 32px; height: 32px; border: 1.5px solid var(--bronze); border-radius: 50%; display: grid; place-items: center; color: var(--bronze); font-size: 1rem; }
.nf h3 { font-size: 1.15rem; margin-bottom: 6px; }
.nf p { opacity: .75; }
.section--dark .eyebrow { color: var(--bronze); }
.section--dark .s-head p { color: var(--bg); opacity: .75; }
@media (min-width: 860px) { .notfor { grid-template-columns: repeat(2, minmax(0,1fr)); column-gap: 48px; background: transparent; } }

/* ---------- Contact ---------- */
.contact { display: grid; gap: 32px; }
.contact__aside { display: grid; gap: 18px; align-content: start; min-width: 0; }
.contact__aside h2 { font-size: clamp(1.7rem, 4.2vw, 2.7rem); }
.contact__aside p { color: var(--muted); }
.tg-card { display: grid; gap: 14px; padding: 22px; background: var(--surface); border: 1px solid var(--line); }
.form { display: grid; gap: 18px; padding: clamp(20px, 4vw, 34px); background: var(--surface); border: 1px solid var(--line); min-width: 0; }
.field { display: grid; gap: 6px; }
.field label { font-weight: 600; font-size: .92rem; }
.field label small { font-weight: 400; color: var(--muted); }
.field input, .field textarea { width: 100%; font: 400 1rem/1.4 var(--f-body); color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: var(--r); padding: .85em 1em; min-height: 50px; transition: border-color .2s, box-shadow .2s; }
.field textarea { min-height: 130px; resize: vertical; }
.field input::placeholder, .field textarea::placeholder { color: var(--muted); opacity: .75; }
.field input:focus, .field textarea:focus { outline: none; border-color: var(--bronze); box-shadow: 0 0 0 4px color-mix(in srgb, var(--bronze) 22%, transparent); }
.field.is-invalid input, .field.is-invalid textarea { border-color: var(--err); }
.field.is-valid input, .field.is-valid textarea { border-color: var(--ok); }
.field__err { min-height: 1.2em; font-size: .85rem; color: var(--err); }
.form__legal { font-size: .82rem; color: var(--muted); }
.form .btn { width: 100%; }
.form .btn[disabled] { opacity: .6; cursor: progress; }
.success { display: grid; gap: 12px; justify-items: start; padding: clamp(22px, 4vw, 34px); background: var(--surface); border: 1.5px solid var(--ok); }
.success__icon { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--ok); color: var(--surface); font-size: 1.4rem; font-weight: 700; }
.success h3 { font-size: 1.3rem; }
.success p { color: var(--muted); }
@media (min-width: 900px) { .contact { grid-template-columns: .9fr 1.1fr; gap: 56px; } }

/* ---------- Footer & FAB ---------- */
.footer { padding-block: 36px calc(36px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); color: var(--muted); font-size: .9rem; }
.footer__row { display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: center; justify-content: space-between; }
.footer a { color: var(--muted); }
.fab { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 60; width: 58px; height: 58px; border-radius: 50%; background: var(--tg); color: #fff; display: grid; place-items: center; box-shadow: 0 10px 28px -8px rgba(34, 158, 217, .7); transition: transform .2s ease; }
.fab:hover { transform: scale(1.06); }
.fab svg { width: 28px; height: 28px; }
.fab__label { position: absolute; right: 70px; white-space: nowrap; padding: .5em .9em; border-radius: 999px; background: var(--ink); color: var(--bg); font-size: .82rem; font-weight: 600; opacity: 0; transform: translateX(6px); transition: .2s; pointer-events: none; }
.fab:hover .fab__label, .fab:focus-visible .fab__label { opacity: 1; transform: none; }

@media (prefers-reduced-motion: no-preference) {
  .ceiling .new { animation: rise 2.4s ease-in-out infinite alternate; }
}
@keyframes rise { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -44; } }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>
</head>

const checked = new Set();

  // Лінія доходу впирається в «стелю» (y=80) і відкочується; пунктир — вихід на новий рівень
  const path = "M20,220 L70,170 L110,120 L140,84 L165,110 L195,88 L220,82 L245,125 L275,95 L300,84 L325,118 L350,92";
  $("#ceilingSvg").innerHTML = `
    <line class="axis" x1="20" y1="230" x2="390" y2="230"/><line class="axis" x1="20" y1="20" x2="20" y2="230"/>
    <line class="lim" x1="20" y1="80" x2="390" y2="80"/>
    <text class="lim-l" x="386" y="72" text-anchor="end">${esc(t.ceil_lim)}</text>
    <path class="inc" d="${path}"/>
    <path class="new" d="M350,92 C365,70 372,45 388,28"/>
    <text class="new-l" x="300" y="36" text-anchor="end">${esc(t.ceil_new)} ↗</text>
    <text x="26" y="34">${esc(t.ceil_income)}</text>
    <text x="386" y="250" text-anchor="end">${esc(t.ceil_time)} →</text>`;
}

function render(t) {
  // hero meta
  const start = pick(CONFIG.start);
  $("#heroMeta").innerHTML = [t.months, t.modules_n, pick(CONFIG.format) || t.format_default, `${t.start} — ${start || t.start_tbd}`]
    .map(x => `<span>${esc(x)}</span>`).join("");

  renderCeiling(t);
  $("#painsList").innerHTML = t.pains.map(([h, p]) => `<li><h3>${esc(h)}</h3><p>${esc(p)}</p></li>`).join("");

  $("#testList").innerHTML = t.test.map((q, i) => `
    <label class="check">
      <input type="checkbox" id="t-${i}" data-i="${i}"${checked.has(i) ? " checked" : ""}>
      <span class="check__box"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m3 8 3.5 3.5L13 5"/></svg></span>
      <span>${esc(q)}</span>
    </label>`).join("");
  updateCount();

  $("#chain").innerHTML = t.chain.map(s => `<span>${esc(s)}</span>`).join('<span class="arr" aria-hidden="true">→</span>');
  $("#steps").innerHTML = t.steps.map(([h, p], i) =>
    `<li class="step"><span class="step__n">0${i + 1}</span><h3>${esc(h)}</h3><p>${esc(p)}</p></li>`).join("");

  const open = [...document.querySelectorAll(".mod")].map(d => d.open);
  $("#modules").innerHTML = t.modules.map((m, i) => `
    <details class="mod"${(open.length ? open[i] : i === 0) ? " open" : ""}>
      <summary>
        <span class="mod__n">0${i + 1}</span>
        <span><span class="mod__kicker">${esc(t.module)} ${i + 1} · ${esc(m.stage)}</span><span class="mod__title">${esc(m.t)}</span></span>
        <span class="mod__plus" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>
      </summary>
      <div class="mod__body">
        <div class="mod__desc">${m.d.map(p => `<p>${esc(p)}</p>`).join("")}<div class="mod__res"><b>${esc(t.result)}</b>${esc(m.r)}</div></div>
        <div class="mod__list"><h4>${esc(m.lh)}</h4><ul>${m.l.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
      </div>
    </details>`).join("");

  $("#outList").innerHTML = t.outcomes.map(([h, p], i, a) =>
    `<article class="out${i === a.length - 1 ? " out--wide" : ""}"><h3>${esc(h)}</h3><p>${esc(p)}</p></article>`).join("");

  $("#bio").innerHTML = t.bio.map(b => `<li>${esc(b)}</li>`).join("");
  $("#stats").innerHTML = t.stats.map(([n, l]) => `<div class="stat"><b>${esc(n)}</b><span>${esc(l)}</span></div>`).join("");

  $("#pkList").innerHTML = CONFIG.packages.map((p, i) => `
    <article class="pk${i === 1 ? " pk--mid" : ""}">
      <h3>${esc(t.pk_names[p.id])}</h3>
      <dl>${Object.keys(t.pk_fields).map(k => {
        const v = pick(p[k]);
        return `<div><dt>${esc(t.pk_fields[k])}</dt><dd${v ? "" : ' class="tbd"'}>${esc(v || t.tbd)}</dd></div>`;
      }).join("")}</dl>
      <a class="btn ${i === 1 ? "btn--primary" : "btn--ghost"} js-pk" href="#contact" data-pk="${p.id}">${esc(t.pk_cta)}</a>
    </article>`).join("");

  $("#faqList").innerHTML = t.faq.map(([q, a]) => `<details><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join("");

  $("#nfList").innerHTML = t.notfor.map(([h, p]) =>
    `<div class="nf"><span class="nf__x" aria-hidden="true">✕</span><div><h3>${esc(h)}</h3><p>${esc(p)}</p></div></div>`).join("");
}

function updateCount() { $("#testCount").textContent = I18N[lang].test_count(checked.size); }

function applyLang(next, animate) {
  const t = I18N[next];
  if (!t) return;
  const run = () => {
    lang = next;
    document.documentElement.lang = next;
    document.title = t.meta_title;
    document.querySelectorAll("[data-i18n]").forEach(el => { const v = t[el.dataset.i18n]; if (typeof v === "string") el.textContent = v; });
    document.querySelectorAll("[data-i18n-ph]").forEach(el => { el.placeholder = t[el.dataset.i18nPh] || ""; });
    document.querySelectorAll("[data-i18n-aria]").forEach(el => el.setAttribute("aria-label", t[el.dataset.i18nAria] || ""));
    document.querySelectorAll("[data-i18n-alt]").forEach(el => el.setAttribute("alt", t[el.dataset.i18nAlt] || ""));
    document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === next)));
    render(t);
    touched.forEach(showField);
    try { localStorage.setItem("lp-lang", next); } catch (e) {}
  };
  if (!animate || matchMedia("(prefers-reduced-motion: reduce)").matches) return run();
  document.body.classList.add("is-switching");
  setTimeout(() => { run(); requestAnimationFrame(() => document.body.classList.remove("is-switching")); }, 220);
}

/* ============================================================
   ФОРМА
   ============================================================ */
const form = $("#leadForm");
const fields = { name: $("#f-name"), contact: $("#f-contact"), message: $("#f-msg") };
const errId = { name: "e-name", contact: "e-contact", message: "e-msg" };
const touched = new Set();

function checkField(key) {
  const t = I18N[lang], v = fields[key].value.trim();
  if (key === "name") return v.replace(/[^\p{L}]/gu, "").length >= 2 ? "" : t.err_name;
  if (key === "contact") {
    if (!v) return t.err_contact_empty;
    const email = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
    const phone = /^\+?\d{10,13}$/.test(v.replace(/[\s()\-.]/g, ""));
    return email || phone ? "" : t.err_contact;
  }
  return v.length <= 1500 ? "" : t.err_msg;
}
function showField(key) {
  const msg = checkField(key), wrap = fields[key].closest(".field");
  wrap.classList.toggle("is-invalid", !!msg);
  wrap.classList.toggle("is-valid", !msg && fields[key].value.trim() !== "");
  fields[key].setAttribute("aria-invalid", String(!!msg));
  document.getElementById(errId[key]).textContent = msg;
  return !msg;
}
Object.keys(fields).forEach(k => {
  fields[k].addEventListener("blur", () => { touched.add(k); showField(k); });
  fields[k].addEventListener("input", () => { if (touched.has(k)) showField(k); });
});

/*
  Підключіть прийом заявок тут. Приклади:
  - Formspree / Getform / Google Apps Script:
      return fetch("https://formspree.io/f/XXXXXXX", {
        method: "POST", headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify(data)
      }).then(r => { if (!r.ok) throw new Error("send failed"); });
  - Telegram-бот — лише через власний сервер / serverless-функцію (токен бота не можна тримати у фронтенді).
*/
function sendLead(data) {
  console.info("Lead:", data);
  return Promise.resolve();
}

form.addEventListener("submit", e => {
  e.preventDefault();
  Object.keys(fields).forEach(k => touched.add(k));
  if (!Object.keys(fields).map(showField).every(Boolean)) { form.querySelector(".is-invalid input, .is-invalid textarea").focus(); return; }
  const btn = form.querySelector("button[type=submit]");
  btn.disabled = true; btn.textContent = I18N[lang].sending;
  const data = {
    name: fields.name.value.trim(), contact: fields.contact.value.trim(), message: fields.message.value.trim(),
    test: [...checked].sort().map(i => I18N[lang].test[i]), lang, sentAt: new Date().toISOString()
  };
  sendLead(data)
    .then(() => { form.hidden = true; $("#formSuccess").hidden = false; $("#formSuccess").focus(); })
    .catch(() => { document.getElementById("e-msg").textContent = I18N[lang].err_send; })
    .finally(() => { btn.disabled = false; btn.textContent = I18N[lang].f_submit; });
});
$("#formAgain").addEventListener("click", () => {
  form.reset(); touched.clear();
  form.querySelectorAll(".field").forEach(f => f.classList.remove("is-valid", "is-invalid"));
  form.querySelectorAll(".field__err").forEach(e => e.textContent = "");
  $("#formSuccess").hidden = true; form.hidden = false; fields.name.focus();
});

/* ============================================================
   ІНТЕРАКЦІЇ
   ============================================================ */
document.querySelectorAll(".js-tg").forEach(a => a.href = CONFIG.telegram);
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => { if (b.dataset.lang !== lang) applyLang(b.dataset.lang, true); }));

const burger = $(".burger"), mnav = $("#mnav");
burger.addEventListener("click", () => { const o = mnav.hidden; mnav.hidden = !o; burger.setAttribute("aria-expanded", String(o)); });
mnav.addEventListener("click", e => { if (e.target.closest("a")) { mnav.hidden = true; burger.setAttribute("aria-expanded", "false"); } });

// Тест: відмітки → лічильник; кнопка переносить обране в поле запиту
$("#testList").addEventListener("change", e => {
  const i = Number(e.target.dataset.i);
  e.target.checked ? checked.add(i) : checked.delete(i);
  updateCount();
});
$("#testCta").addEventListener("click", () => {
  if (!checked.size) return;
  const t = I18N[lang];
  const list = [...checked].sort().map(i => "— " + t.test[i]).join("\n");
  const cur = fields.message.value.trim();
  fields.message.value = (cur ? cur + "\n\n" : "") + t.test_msg + "\n" + list;
});
// Пакет → у поле запиту
document.addEventListener("click", e => {
  const a = e.target.closest(".js-pk");
  if (!a) return;
  const t = I18N[lang];
  if (!fields.message.value.trim()) fields.message.value = `${t.pk_msg} ${t.pk_names[a.dataset.pk]}`;
});

let saved = null;
try { saved = localStorage.getItem("lp-lang"); } catch (e) {}
applyLang(I18N[saved] ? saved : CONFIG.defaultLang, false);
</script>
